<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f1">
<title>Labdhi Desk</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/mobile.css">
<link rel="icon" href="/img/labdhi-mark.png">
<!-- Added to a phone's home screen this opens full screen, with no browser bar,
     and still serves the same desk - so it never needs updating. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Labdhi Desk">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="/img/labdhi-mark.png" alt="">
      <div><span id="company">Trading Desk</span><small>polymer book</small></div>
    </div>
    <div class="ticker" id="ticker"></div>
    <nav class="nav">
      <button data-route="desk" class="on">Desk</button>
      <button data-route="stock">Stock</button>
      <button data-route="flow">Flow</button>
      <button data-route="tape">Tape</button>
      <button data-route="setup">Setup</button>
    </nav>
    <div class="actions">
      <button class="big-btn buy" id="btn-buy">Buy <kbd>B</kbd></button>
      <button class="big-btn sell" id="btn-sell">Sell <kbd>S</kbd></button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div id="toasts"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
